# Template for an nginx http{} include (for example, conf.d/prokbot-ssh.conf).
# Not deployed automatically. Install the matching certificate/key first.
map $http_upgrade $prokbot_connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 127.0.0.1:18443 ssl;
    server_name localhost;

    # The leaf certificate must contain subjectAltName IP:127.0.0.1.
    ssl_certificate /opt/prokbot/ssh-tls/server-chain.pem;
    ssl_certificate_key /opt/prokbot/ssh-tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $prokbot_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
